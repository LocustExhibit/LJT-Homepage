name: Inspect Pages deployment settings

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Print Pages and environment settings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for endpoint in pages environments/github-pages environments/github-pages/deployment-branch-policies; do
            echo "===== $endpoint ====="
            curl -sS -i \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/$endpoint"
            echo
          done
