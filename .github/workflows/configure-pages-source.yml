name: Configure Pages source

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Switch GitHub Pages to the gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API="https://api.github.com/repos/${{ github.repository }}"
          AUTH=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28")

          curl -sS -i -X PUT "${AUTH[@]}" "$API/pages" \
            -d '{"build_type":"branch","source":{"branch":"gh-pages","path":"/"}}'
          echo
          curl -sS "${AUTH[@]}" "$API/pages"
          echo
