name: Configure Pages and deployment environment

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  actions: write

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages source and environment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API="https://api.github.com/repos/${{ github.repository }}"
          AUTH=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28")

          echo "===== Delete temporary gh-pages branch if present ====="
          curl -sS -i -X DELETE "${AUTH[@]}" "$API/git/refs/heads/gh-pages" || true
          echo

          echo "===== Switch Pages to GitHub Actions ====="
          curl -sS -i -X PUT "${AUTH[@]}" "$API/pages" -d '{"build_type":"workflow"}'
          echo

          echo "===== Allow master deployments to github-pages environment ====="
          curl -sS -i -X POST "${AUTH[@]}" "$API/environments/github-pages/deployment-branch-policies" -d '{"name":"master"}' || true
          echo

          echo "===== Verify Pages settings ====="
          curl -sS -i "${AUTH[@]}" "$API/pages"
          echo

          echo "===== Verify deployment branch policies ====="
          curl -sS -i "${AUTH[@]}" "$API/environments/github-pages/deployment-branch-policies"
          echo
